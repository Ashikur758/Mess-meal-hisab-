<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসের মিল হিসাব</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Hind Siliguri for clean Bengali typography -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #F3F5F4;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #115E49; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-[#115E49] text-white shadow-md sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <!-- 9-Dot Menu Button -->
                <button onclick="toggleMenu()" class="p-2 rounded-lg hover:bg-[#0d4a39] transition focus:outline-none" title="মেনু">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
                        <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
                        <circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
                    </svg>
                </button>
                <h1 id="header-title" class="text-xl font-semibold tracking-wide">মিল হিসাব</h1>
            </div>

            <!-- Manager Login / Logout Button -->
            <div>
                <button id="btn-open-login" onclick="openLoginModal()" class="bg-white/15 hover:bg-white/25 text-white text-sm px-3.5 py-1.5 rounded-lg font-medium transition">
                    ম্যানেজার লগইন
                </button>
                <div id="manager-badge" class="hidden flex items-center gap-2">
                    <span class="text-xs bg-emerald-400/20 text-emerald-100 px-2.5 py-1 rounded-md border border-emerald-400/30">ম্যানেজার</span>
                    <button onclick="logoutManager()" class="bg-red-500/80 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
                        লগআউট
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Slide-out 9-Dot Navigation Drawer -->
    <div id="sidebar-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>
    <aside id="sidebar-menu" class="fixed top-0 left-0 w-72 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
        <div class="bg-[#115E49] text-white p-5 flex items-center justify-between">
            <span class="text-lg font-bold">মেস ম্যানেজমেন্ট</span>
            <button onclick="toggleMenu()" class="p-1 rounded hover:bg-white/20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <nav class="p-4 space-y-2 flex-1">
            <button onclick="navigate('meals')" class="nav-btn w-full text-left px-4 py-3 rounded-lg font-medium flex items-center gap-3 hover:bg-[#115E49]/10 text-gray-700" data-tab="meals">
                <span>🍽️</span> মিল হিসাব
            </button>
            <button onclick="navigate('deposits')" class="nav-btn w-full text-left px-4 py-3 rounded-lg font-medium flex items-center gap-3 hover:bg-[#115E49]/10 text-gray-700" data-tab="deposits">
                <span>💰</span> আদায় টাকা
            </button>
            <button onclick="navigate('expenses')" class="nav-btn w-full text-left px-4 py-3 rounded-lg font-medium flex items-center gap-3 hover:bg-[#115E49]/10 text-gray-700" data-tab="expenses">
                <span>🛒</span> খরচ টাকা
            </button>
            <button onclick="navigate('rate')" class="nav-btn w-full text-left px-4 py-3 rounded-lg font-medium flex items-center gap-3 hover:bg-[#115E49]/10 text-gray-700" data-tab="rate">
                <span>📊</span> মিল রেট
            </button>
            <button onclick="navigate('maid')" class="nav-btn w-full text-left px-4 py-3 rounded-lg font-medium flex items-center gap-3 hover:bg-[#115E49]/10 text-gray-700" data-tab="maid">
                <span>🧹</span> খালার টাকা
            </button>
        </nav>
        <!-- Developer Credit in Sidebar -->
        <div class="p-4 border-t bg-gray-50 text-center">
            <p class="text-[11px] text-gray-400">তৈরি করেছেন</p>
            <p class="text-xs font-semibold text-[#115E49] mt-0.5">মো: আশিকুর রহমান আশিক</p>
            <p class="text-[11px] font-medium text-gray-500">আইসিটি বিভাগ</p>
        </div>
    </aside>

    <!-- Main Content Container -->
    <main class="max-w-4xl w-full mx-auto px-4 py-6 flex-1">
        <!-- Loading State -->
        <div id="loading-spinner" class="text-center py-12 text-gray-500">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#115E49] mx-auto mb-3"></div>
            ডাটা লোড হচ্ছে...
        </div>

        <!-- Dynamic View Area -->
        <div id="app-content" class="hidden space-y-4"></div>
    </main>

    <!-- Footer with Developer Name & Department -->
    <footer class="py-4 text-center text-xs text-gray-500 border-t border-gray-200/70 mt-auto">
        তৈরি করেছেন: <span class="font-semibold text-[#115E49]">মো: আশিকুর রহমান আশিক</span>, আইসিটি বিভাগ
    </footer>

    <!-- Manager Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-xl">
            <h2 class="text-xl font-bold text-[#115E49] mb-1">ম্যানেজার লগইন</h2>
            <p class="text-sm text-gray-500 mb-4">হিসাব পরিবর্তনের জন্য ইমেইল ও পাসওয়ার্ড দিন</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ইমেইল</label>
                    <input type="email" id="login-email" required placeholder="manager@mess.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#115E49]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#115E49]">
                </div>
                <p id="login-error" class="text-red-500 text-xs hidden"></p>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">বাতিল</button>
                    <button type="submit" id="login-submit-btn" class="px-4 py-2 text-sm bg-[#115E49] hover:bg-[#0d4a39] text-white rounded-lg font-medium">প্রবেশ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Modal (For Delete / Reset) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-xl text-center">
            <h3 id="confirm-title" class="text-lg font-bold text-gray-800 mb-2">আপনি কি নিশ্চিত?</h3>
            <p id="confirm-desc" class="text-sm text-gray-600 mb-6"></p>
            <div class="flex justify-center gap-3">
                <button onclick="closeConfirmModal()" class="px-5 py-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium">না</button>
                <button id="confirm-yes-btn" class="px-5 py-2 text-sm bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">হ্যাঁ, নিশ্চিত</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ==========================================
        // আপনার FIREBASE CONFIGURATION এখানে বসান
        // ==========================================
        const firebaseConfig = {
            apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: "",
  measurementId: ""
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const messDocRef = doc(db, "mess_data", "current_month");

        // Global State
        let isManager = false;
        let currentTab = 'meals';
        let selectedMemberId = null;
        let messData = {
            startDate: "2026-11-06",
            members: [],
            expenses: []
        };

        // Convert English numbers to Bengali
        const toBn = (num) => {
            const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return String(num).replace(/\d/g, d => bnDigits[d]);
        };

        // Listen to Auth State (Manager vs Public Viewer)
        onAuthStateChanged(auth, (user) => {
            isManager = !!user;
            document.getElementById('btn-open-login').classList.toggle('hidden', isManager);
            document.getElementById('manager-badge').classList.toggle('hidden', !isManager);
            render();
        });

        // Listen to Real-time Firestore Data
        onSnapshot(messDocRef, (docSnap) => {
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            if (docSnap.exists()) {
                const data = docSnap.data();
                messData = {
                    startDate: data.startDate || "2026-11-06",
                    members: data.members || [],
                    expenses: data.expenses || []
                };
            } else if (isManager) {
                saveData();
            }
            render();
        }, (error) => {
            console.error("Firestore Error:", error);
            document.getElementById('loading-spinner').innerHTML = `<p class="text-red-500">ডাটাবেস সংযোগ হয়নি। কোডে আপনার Firebase Config বসানো হয়েছে কি না নিশ্চিত করুন।</p>`;
        });

        // Save Data to Firestore
        async function saveData() {
            if (!isManager) return;
            try {
                await setDoc(messDocRef, messData);
            } catch (err) {
                alert("ডাটা সেভ করতে সমস্যা হয়েছে: " + err.message);
            }
        }

        // Auth Functions
        window.openLoginModal = () => {
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('hidden');
        };
        window.closeLoginModal = () => document.getElementById('login-modal').classList.add('hidden');

        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('login-submit-btn');

            btn.textContent = "অপেক্ষা করুন...";
            btn.disabled = true;
            errEl.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeLoginModal();
                e.target.reset();
            } catch (err) {
                errEl.textContent = "ইমেইল বা পাসওয়ার্ড ভুল হয়েছে!";
                errEl.classList.remove('hidden');
            } finally {
                btn.textContent = "প্রবেশ করুন";
                btn.disabled = false;
            }
        };

        window.logoutManager = () => signOut(auth);

        // Navigation & Menu
        window.toggleMenu = () => {
            const sidebar = document.getElementById('sidebar-menu');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = !sidebar.classList.contains('-translate-x-full');
            if (isOpen) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            }
        };

        window.navigate = (tab) => {
            currentTab = tab;
            selectedMemberId = null;
            toggleMenu();
            render();
        };

        // Custom Confirm Dialog
        let confirmCallback = null;
        window.askConfirm = (title, desc, callback) => {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-desc').textContent = desc;
            confirmCallback = callback;
            document.getElementById('confirm-modal').classList.remove('hidden');
        };
        window.closeConfirmModal = () => document.getElementById('confirm-modal').classList.add('hidden');
        document.getElementById('confirm-yes-btn').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        };

        // Helper Calculations
        function getMemberTotalMeals(member) {
            if (!member.meals) return { b: 0, l: 0, d: 0, total: 0 };
            let b = 0, l = 0, d = 0;
            for (let i = 0; i < 30; i++) {
                const day = member.meals[i];
                if (day) {
                    if (day.b) b++;
                    if (day.l) l++;
                    if (day.d) d++;
                }
            }
            return { b, l, d, total: (b * 0.5) + l + d };
        }

        function getGrandTotals() {
            let totalMeals = 0;
            let totalDeposits = 0;
            let totalMaid = 0;
            messData.members.forEach(m => {
                totalMeals += getMemberTotalMeals(m).total;
                totalDeposits += Number(m.deposit || 0);
                totalMaid += Number(m.maid || 0);
            });
            let totalExpenses = messData.expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
            let mealRate = totalMeals > 0 ? (totalExpenses / totalMeals) : 0;
            return { totalMeals, totalDeposits, totalMaid, totalExpenses, mealRate };
        }

        // Format Date: "Friday, 6 November 2026"
        function getFormattedDate(startDateStr, offsetDays) {
            const parts = startDateStr.split('-');
            const date = new Date(parts[0], parts[1] - 1, parts[2]);
            date.setDate(date.getDate() + offsetDays);
            const weekday = date.toLocaleDateString('en-US', { weekday: 'long' });
            const day = date.getDate();
            const month = date.toLocaleDateString('en-US', { month: 'long' });
            const year = date.getFullYear();
            return `${weekday}, ${day} ${month} ${year}`;
        }

        // ==========================================
        // ACTIONS (Manager Only)
        // ==========================================
        window.addMember = () => {
            if (!isManager) return;
            const input = document.getElementById('new-member-name');
            const name = input.value.trim();
            if (!name) return;
            messData.members.push({
                id: Date.now().toString(),
                name: name,
                deposit: 0,
                maid: 0,
                meals: {}
            });
            input.value = '';
            saveData();
        };

        window.deleteMember = (id, name) => {
            if (!isManager) return;
            askConfirm("আপনি কি নিশ্চিত?", `"${name}"-কে মুছে ফেললে তার মিল, আদায় ও খালার টাকার হিসাবও মুছে যাবে।`, () => {
                messData.members = messData.members.filter(m => m.id !== id);
                saveData();
            });
        };

        window.openMemberSheet = (id) => {
            selectedMemberId = id;
            render();
        };

        window.backToMembers = () => {
            selectedMemberId = null;
            render();
        };

        window.toggleMealCheck = (memberId, dayIdx, type) => {
            if (!isManager) return;
            const member = messData.members.find(m => m.id === memberId);
            if (!member) return;
            if (!member.meals) member.meals = {};
            if (!member.meals[dayIdx]) member.meals[dayIdx] = { b: false, l: false, d: false };
            member.meals[dayIdx][type] = !member.meals[dayIdx][type];
            saveData();
        };

        window.changeStartDate = () => {
            if (!isManager) return;
            const newDate = document.getElementById('mess-start-date').value;
            if (!newDate) return;
            askConfirm("নতুন মাস শুরু করবেন?", "নতুন শুরুর তারিখ দিলে সবার আগের মিলের টিক বক্সগুলো মুছে নতুন করে শুরু হবে।", () => {
                messData.startDate = newDate;
                messData.members.forEach(m => m.meals = {});
                saveData();
            });
        };

        window.addDeposit = (memberId) => {
            if (!isManager) return;
            const input = document.getElementById(`dep-add-${memberId}`);
            const val = Number(input.value);
            if (!val) return;
            const member = messData.members.find(m => m.id === memberId);
            if (member) {
                member.deposit = Number(member.deposit || 0) + val;
                input.value = '';
                saveData();
            }
        };

        window.editTotalDeposit = (memberId, newVal) => {
            if (!isManager) return;
            const member = messData.members.find(m => m.id === memberId);
            if (member) {
                member.deposit = Number(newVal || 0);
                saveData();
            }
        };

        window.updateMaidMoney = (memberId, val) => {
            if (!isManager) return;
            const member = messData.members.find(m => m.id === memberId);
            if (member) {
                member.maid = Number(val || 0);
                saveData();
            }
        };

        window.toggleExpenseForm = () => {
            document.getElementById('expense-form-box').classList.toggle('hidden');
        };

        window.addExpense = (e) => {
            e.preventDefault();
            if (!isManager) return;
            const shopper = document.getElementById('exp-shopper').value.trim();
            const item = document.getElementById('exp-item').value.trim();
            const date = document.getElementById('exp-date').value;
            const amount = Number(document.getElementById('exp-amount').value);
            if (!shopper || !item || !date || !amount) return;

            messData.expenses.push({
                id: Date.now().toString(),
                shopper, item, date, amount
            });
            e.target.reset();
            saveData();
        };

        window.deleteExpense = (id) => {
            if (!isManager) return;
            askConfirm("আপনি কি নিশ্চিত?", "এই খরচের হিসাবটি মুছে ফেলতে চান?", () => {
                messData.expenses = messData.expenses.filter(ex => ex.id !== id);
                saveData();
            });
        };

        // ==========================================
        // RENDER VIEWS
        // ==========================================
        function render() {
            const container = document.getElementById('app-content');
            const headerTitle = document.getElementById('header-title');

            // Highlight active sidebar tab
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const active = btn.dataset.tab === currentTab;
                btn.classList.toggle('bg-[#115E49]', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('text-gray-700', !active);
            });

            // 1. INDIVIDUAL MEMBER MEAL SHEET
            if (currentTab === 'meals' && selectedMemberId) {
                const member = messData.members.find(m => m.id === selectedMemberId);
                if (!member) { selectedMemberId = null; render(); return; }
                headerTitle.textContent = `${member.name} - মিল শিট`;
                const counts = getMemberTotalMeals(member);

                let rowsHtml = '';
                for (let i = 0; i < 30; i++) {
                    const dayMeals = (member.meals && member.meals[i]) || { b: false, l: false, d: false };
                    const dateStr = getFormattedDate(messData.startDate, i);
                    rowsHtml += `
                        <tr class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="py-2.5 px-3 text-sm font-medium text-gray-700 whitespace-nowrap">${dateStr}</td>
                            <td onclick="toggleMealCheck('${member.id}', ${i}, 'b')" class="py-2.5 px-3 text-center border-l cursor-pointer select-none transition ${dayMeals.b ? 'bg-emerald-500 text-white font-bold' : 'bg-white'}">
                                ${dayMeals.b ? '✓' : ''}
                            </td>
                            <td onclick="toggleMealCheck('${member.id}', ${i}, 'l')" class="py-2.5 px-3 text-center border-l cursor-pointer select-none transition ${dayMeals.l ? 'bg-emerald-500 text-white font-bold' : 'bg-white'}">
                                ${dayMeals.l ? '✓' : ''}
                            </td>
                            <td onclick="toggleMealCheck('${member.id}', ${i}, 'd')" class="py-2.5 px-3 text-center border-l cursor-pointer select-none transition ${dayMeals.d ? 'bg-emerald-500 text-white font-bold' : 'bg-white'}">
                                ${dayMeals.d ? '✓' : ''}
                            </td>
                        </tr>
                    `;
                }

                container.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <button onclick="backToMembers()" class="bg-white border border-gray-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 flex items-center gap-1">
                            ← তালিকায় ফিরে যান
                        </button>
                        <div class="flex gap-2 text-xs sm:text-sm bg-white px-3 py-2 rounded-lg border border-gray-200 shadow-sm">
                            <span>সকাল: <b>${toBn(counts.b)}</b></span> |
                            <span>দুপুর: <b>${toBn(counts.l)}</b></span> |
                            <span>রাত: <b>${toBn(counts.d)}</b></span> |
                            <span class="text-[#115E49] font-bold">মোট: ${toBn(counts.total)}</span>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-amber-400 text-gray-900 font-bold text-sm">
                                    <th class="py-3 px-3">তারিখ</th>
                                    <th class="py-3 px-3 text-center border-l border-amber-500/40 w-20">সকাল</th>
                                    <th class="py-3 px-3 text-center border-l border-amber-500/40 w-20">দুপুর</th>
                                    <th class="py-3 px-3 text-center border-l border-amber-500/40 w-20">রাত</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                `;
                return;
            }

            // 2. MEAL CALCULATION (MEMBER LIST)
            if (currentTab === 'meals') {
                headerTitle.textContent = "মিল হিসাব";
                const totals = getGrandTotals();

                let listHtml = messData.members.map(m => {
                    const mTotal = getMemberTotalMeals(m).total;
                    return `
                        <div class="bg-white border border-gray-200 rounded-xl px-4 py-3.5 flex items-center justify-between shadow-sm hover:border-[#115E49]/40 transition">
                            <button onclick="openMemberSheet('${m.id}')" class="text-left font-medium text-gray-800 hover:text-[#115E49] flex-1 flex items-center justify-between pr-4">
                                <span class="text-base">${m.name}</span>
                                <span class="text-sm bg-gray-100 text-gray-700 px-3 py-1 rounded-full font-semibold">মোট মিল: ${toBn(mTotal)}</span>
                            </button>
                            ${isManager ? `
                                <button onclick="deleteMember('${m.id}', '${m.name}')" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition" title="মুছে ফেলুন">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <!-- Start Date Box -->
                    <div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-sm">
                        <div>
                            <span class="text-xs text-gray-500 block">মাসের শুরুর তারিখ</span>
                            <span class="font-semibold text-gray-800">${getFormattedDate(messData.startDate, 0)}</span>
                        </div>
                        ${isManager ? `
                            <div class="flex items-center gap-2">
                                <input type="date" id="mess-start-date" value="${messData.startDate}" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm">
                                <button onclick="changeStartDate()" class="bg-[#115E49] text-white text-xs px-3 py-2 rounded-lg font-medium hover:bg-[#0d4a39]">নতুন মাস শুরু</button>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Members List -->
                    <div class="space-y-2.5">${listHtml || '<p class="text-center text-gray-400 py-6">কোনো সদস্য যোগ করা হয়নি</p>'}</div>

                    <!-- Add Member Input (Manager Only) -->
                    ${isManager ? `
                        <div class="bg-white border border-gray-200 rounded-xl p-3 flex gap-2 shadow-sm">
                            <input type="text" id="new-member-name" placeholder="নতুন সদস্যের নাম লিখুন..." class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#115E49]">
                            <button onclick="addMember()" class="bg-[#115E49] hover:bg-[#0d4a39] text-white px-4 py-2 rounded-lg font-bold text-lg leading-none">+</button>
                        </div>
                    ` : ''}

                    <!-- Total Bar -->
                    <div class="bg-[#115E49] text-white rounded-xl px-5 py-4 flex items-center justify-between font-bold text-lg shadow-sm">
                        <span>সর্বমোট মিল</span>
                        <span>${toBn(totals.totalMeals)} টি</span>
                    </div>
                `;
                return;
            }

            // 3. DEPOSITS (আদায় টাকা)
            if (currentTab === 'deposits') {
                headerTitle.textContent = "আদায় টাকা";
                const totals = getGrandTotals();

                let listHtml = messData.members.map(m => `
                    <div class="bg-white border border-gray-200 rounded-xl px-4 py-3.5 flex flex-wrap items-center justify-between gap-3 shadow-sm">
                        <span class="font-medium text-gray-800 text-base">${m.name}</span>
                        <div class="flex items-center gap-2 ml-auto">
                            ${isManager ? `
                                <input type="number" id="dep-add-${m.id}" placeholder="টাকা" class="w-24 px-2.5 py-1.5 border border-gray-300 rounded-lg text-sm text-right focus:outline-none focus:border-[#115E49]">
                                <button onclick="addDeposit('${m.id}')" class="bg-[#115E49] hover:bg-[#0d4a39] text-white px-3 py-1.5 rounded-lg font-bold text-sm">+</button>
                                <div class="flex items-center gap-1 pl-2 border-l border-gray-200">
                                    <span class="text-xs text-gray-500">মোট:</span>
                                    <input type="number" value="${m.deposit || 0}" onchange="editTotalDeposit('${m.id}', this.value)" class="w-24 px-2 py-1 border border-gray-200 bg-gray-50 rounded-lg text-sm font-bold text-right text-[#115E49]">
                                </div>
                            ` : `
                                <span class="font-bold text-[#115E49] text-base">৳ ${toBn(m.deposit || 0)}</span>
                            `}
                        </div>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="space-y-2.5">${listHtml || '<p class="text-center text-gray-400 py-6">কোনো সদস্য নেই</p>'}</div>
                    <div class="bg-[#115E49] text-white rounded-xl px-5 py-4 flex items-center justify-between font-bold text-lg shadow-sm">
                        <span>মোট আদায়</span>
                        <span>৳ ${toBn(totals.totalDeposits)}</span>
                    </div>
                `;
                return;
            }

            // 4. EXPENSES (খরচ টাকা)
            if (currentTab === 'expenses') {
                headerTitle.textContent = "খরচ টাকা";
                const totals = getGrandTotals();

                let rowsHtml = messData.expenses.map(ex => `
                    <tr class="border-b border-gray-200 hover:bg-gray-50">
                        <td class="py-3 px-4 text-sm font-medium">${ex.shopper}</td>
                        <td class="py-3 px-4 text-sm text-gray-600">${ex.item}</td>
                        <td class="py-3 px-4 text-sm text-gray-500 whitespace-nowrap">${ex.date}</td>
                        <td class="py-3 px-4 text-sm font-bold text-right text-gray-800">৳ ${toBn(ex.amount)}</td>
                        ${isManager ? `
                            <td class="py-3 px-2 text-center">
                                <button onclick="deleteExpense('${ex.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold">✕</button>
                            </td>
                        ` : ''}
                    </tr>
                `).join('');

                container.innerHTML = `
                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-700 text-xs uppercase border-b border-gray-200">
                                    <th class="py-3 px-4">বাজারকারীর নাম</th>
                                    <th class="py-3 px-4">কী খরচ করেছে</th>
                                    <th class="py-3 px-4">তারিখ</th>
                                    <th class="py-3 px-4 text-right">পরিমাণ</th>
                                    ${isManager ? '<th class="py-3 px-2"></th>' : ''}
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml || `<tr><td colspan="5" class="text-center py-6 text-gray-400 text-sm">এখনো কোনো খরচ যোগ করা হয়নি</td></tr>`}
                            </tbody>
                        </table>
                    </div>

                    ${isManager ? `
                        <div>
                            <button onclick="toggleExpenseForm()" class="bg-white border border-[#115E49] text-[#115E49] hover:bg-[#115E49]/5 px-4 py-2 rounded-xl text-sm font-semibold">
                                + যোগ করুন (Add)
                            </button>
                            <form id="expense-form-box" onsubmit="addExpense(event)" class="hidden mt-3 bg-white border border-gray-200 rounded-xl p-4 grid grid-cols-1 sm:grid-cols-2 gap-3 shadow-sm">
                                <input type="text" id="exp-shopper" required placeholder="বাজারকারীর নাম" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                <input type="text" id="exp-item" required placeholder="কী খরচ করেছে (যেমন: চাল, ডাল)" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                <input type="date" id="exp-date" required class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                <input type="number" id="exp-amount" required placeholder="পরিমাণ (টাকা)" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                <button type="submit" class="sm:col-span-2 bg-[#115E49] text-white py-2 rounded-lg text-sm font-medium hover:bg-[#0d4a39]">সেভ করুন</button>
                            </form>
                        </div>
                    ` : ''}

                    <div class="bg-[#115E49] text-white rounded-xl px-5 py-4 flex items-center justify-between font-bold text-lg shadow-sm">
                        <span>মোট খরচ</span>
                        <span>৳ ${toBn(totals.totalExpenses)}</span>
                    </div>
                `;
                return;
            }
            // 5. MEAL RATE (মিল রেট) ও চূড়ান্ত হিসাব
            if (currentTab === 'rate') {
                headerTitle.textContent = "মিল রেট ও চূড়ান্ত হিসাব";
                const totals = getGrandTotals();

                // সদস্যদের চূড়ান্ত হিসাব তৈরি করা
                let finalTableRows = messData.members.map(m => {
                    const mMeals = getMemberTotalMeals(m).total;
                    const mealCost = Math.round(mMeals * totals.mealRate);
                    const maidCost = Number(m.maid || 0);
                    const totalBill = mealCost + maidCost;
                    const deposit = Number(m.deposit || 0);
                    const balance = deposit - totalBill;

                    let balanceText = '';
                    let balanceColor = '';
                    
                    if (balance > 0) {
                        balanceText = `পাবে ৳ ${toBn(balance)}`;
                        balanceColor = 'text-emerald-600 font-bold'; // সবুজ রঙ
                    } else if (balance < 0) {
                        balanceText = `দেবে ৳ ${toBn(Math.abs(balance))}`;
                        balanceColor = 'text-red-600 font-bold'; // লাল রঙ
                    } else {
                        balanceText = `সমান ৳ ০`;
                        balanceColor = 'text-gray-500 font-medium'; // ধূসর রঙ
                    }

                    return `
                        <tr class="border-b border-gray-100 hover:bg-gray-50 text-sm">
                            <td class="py-3 px-4 font-medium text-gray-800">${m.name}</td>
                            <td class="py-3 px-4 text-center text-gray-700">${toBn(mMeals)}</td>
                            <td class="py-3 px-4 text-right text-gray-700">৳ ${toBn(mealCost)}</td>
                            <td class="py-3 px-4 text-right text-gray-700">৳ ${toBn(maidCost)}</td>
                            <td class="py-3 px-4 text-right font-semibold text-gray-800">৳ ${toBn(totalBill)}</td>
                            <td class="py-3 px-4 text-right font-semibold text-[#115E49]">৳ ${toBn(deposit)}</td>
                            <td class="py-3 px-4 text-right ${balanceColor}">${balanceText}</td>
                        </tr>
                    `;
                }).join('');

                container.innerHTML = `
                    <!-- উপরের সামারি কার্ডগুলো -->
                    <div class="space-y-3 mb-6">
                        <div class="bg-white border border-gray-200 rounded-xl px-5 py-4 flex items-center justify-between shadow-sm">
                            <span class="text-gray-700 font-medium">মোট বাজার খরচ</span>
                            <span class="font-bold text-lg text-gray-900">৳ ${toBn(totals.totalExpenses)}</span>
                        </div>
                        <div class="bg-white border border-gray-200 rounded-xl px-5 py-4 flex items-center justify-between shadow-sm">
                            <span class="text-gray-700 font-medium">সর্বমোট মিল</span>
                            <span class="font-bold text-lg text-gray-900">${toBn(totals.totalMeals)} টি</span>
                        </div>
                        <div class="bg-[#115E49] text-white rounded-xl px-5 py-5 flex items-center justify-between font-bold text-xl shadow-sm">
                            <span>বর্তমান মিল রেট</span>
                            <span>৳ ${toBn(totals.mealRate.toFixed(2))}</span>
                        </div>
                    </div>

                    <!-- সদস্যভিত্তিক চূড়ান্ত হিসাব (মিল + খালা + জমা) টেবিল -->
                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-6">
                        <div class="bg-gray-100 px-4 py-3 border-b border-gray-200">
                            <h3 class="font-bold text-gray-800 text-sm sm:text-base">সদস্যভিত্তিক চূড়ান্ত হিসাব (মিল + খালা + জমা)</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse whitespace-nowrap">
                                <thead>
                                    <tr class="bg-gray-50 text-gray-700 text-xs sm:text-sm border-b border-gray-200">
                                        <th class="py-3 px-4 font-semibold">নাম</th>
                                        <th class="py-3 px-4 text-center font-semibold">মিল</th>
                                        <th class="py-3 px-4 text-right font-semibold">মিল খরচ</th>
                                        <th class="py-3 px-4 text-right font-semibold">খালা</th>
                                        <th class="py-3 px-4 text-right font-semibold">মোট বিল</th>
                                        <th class="py-3 px-4 text-right font-semibold">জমা</th>
                                        <th class="py-3 px-4 text-right font-semibold">হিসাব</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${finalTableRows || `<tr><td colspan="7" class="text-center py-6 text-gray-400 text-sm">কোনো সদস্য নেই</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                return;
            }

            // 6. MAID MONEY (খালার টাকা)
            if (currentTab === 'maid') {
                headerTitle.textContent = "খালার টাকা";
                const totals = getGrandTotals();

                let listHtml = messData.members.map(m => `
                    <div class="bg-white border border-gray-200 rounded-xl px-4 py-3 flex items-center justify-between shadow-sm">
                        <span class="font-medium text-gray-800 text-base">${m.name}</span>
                        ${isManager ? `
                            <input type="number" value="${m.maid || 0}" onchange="updateMaidMoney('${m.id}', this.value)" class="w-28 px-3 py-1.5 border border-gray-300 rounded-lg text-right font-medium text-gray-800 focus:outline-none focus:border-[#115E49]">
                        ` : `
                            <span class="font-semibold text-gray-800 border border-gray-200 px-4 py-1.5 rounded-lg bg-gray-50">${toBn(m.maid || 0)}</span>
                        `}
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="space-y-2.5">${listHtml || '<p class="text-center text-gray-400 py-6">কোনো সদস্য নেই</p>'}</div>
                    <div class="bg-[#115E49] text-white rounded-xl px-5 py-4 flex items-center justify-between font-bold text-lg shadow-sm">
                        <span>মোট</span>
                        <span>৳ ${toBn(totals.totalMaid)}</span>
                    </div>
                `;
                return;
            }
        }
    </script>
</body>
</html>
